name: ci

on:
  push:
    branches: [main]
    # The deploy job commits new image tags to values.yaml; don't let that commit start another run.
    paths-ignore: ["helm/devoker/values.yaml", "**.md", "troubleshooting/**"]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/imajij # image names must be lowercase; the GitHub owner is imajij
  TRIVY: aquasec/trivy:0.75.0

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  test-frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: bandit (fails on HIGH)
        run: pip install bandit && bandit -r backend/app --severity-level high

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: pip-audit (Python dependencies)
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - name: npm audit (fails on HIGH)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: trivy fs (dependencies and Kubernetes/Helm misconfigurations)
        run: >
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY" fs --exit-code 1
          --severity HIGH,CRITICAL --scanners vuln,misconfig --ignorefile security/.trivyignore .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # scan the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  build-scan-push:
    needs: [test-backend, test-frontend, sast, sca, secrets]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      IMAGE: ghcr.io/imajij/devoker-${{ matrix.component }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t "$IMAGE" ${{ matrix.component }}
      # Scan before pushing: a vulnerable image never reaches the registry, so nothing can deploy it.
      - name: Trivy image gate (fails on fixable HIGH/CRITICAL)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/security:/security"
          "$TRIVY" image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
          --ignorefile /security/.trivyignore "$IMAGE"
      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      # amd64 for cloud runners and clusters, arm64 for Apple Silicon minikube.
      - name: Push (linux/amd64 + linux/arm64)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 -t "$IMAGE" --push ${{ matrix.component }}

  deploy:
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    concurrency: { group: deploy, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - name: Point the Helm values at the new images (Argo CD deploys from git)
        run: |
          yq -i '.backend.image.tag = "${{ github.sha }}" | .frontend.image.tag = "${{ github.sha }}"' helm/devoker/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: images ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase && git push
