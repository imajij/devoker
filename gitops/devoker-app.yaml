apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devoker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/imajij/devoker.git
    targetRevision: main
    path: helm/devoker
  destination:
    server: https://kubernetes.default.svc
    namespace: devoker
  syncPolicy:
    automated:
      prune: true    # delete what git no longer has
      selfHeal: true # undo manual kubectl edits
    syncOptions: [CreateNamespace=true]
