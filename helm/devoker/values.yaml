backend:
  image:
    repository: ghcr.io/imajij/devoker-backend
    tag: daef131156917fe6e93e50ee94229e9d014781ed
  replicas: 2 # safe: all game state is in Postgres, so any replica can serve any player
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
frontend:
  image:
    repository: ghcr.io/imajij/devoker-frontend
    tag: daef131156917fe6e93e50ee94229e9d014781ed
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPU: 50
  logStorage: 1Gi
postgres:
  image: postgres:16-alpine
  database: devoker
  user: devoker
  storage: 1Gi
  # Created out of band, never committed (see README):
  #   kubectl -n devoker create secret generic devoker-db --from-literal=password=<random>
  existingSecret: devoker-db
game:
  startingChips: 1000
  smallBlind: 10
  bigBlind: 20
ingress:
  enabled: true
  host: devoker.localhost # browsers resolve *.localhost to 127.0.0.1, so no /etc/hosts entry is needed
monitoring:
  # Needs the Prometheus Operator CRDs (kube-prometheus-stack). Turn off on a cluster without them.
  enabled: true
imagePullPolicy: IfNotPresent
